schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Tech stack: Go 1.27, bubbletea/lipgloss TUI, SQLite (glebarez/go-sqlite),
  gofeed for feed parsing.
  Commits follow the seven rules at https://cbea.ms/git-commit/ (see AGENTS.md).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  archive:
    guidance:
      - As the final action, stage and commit the archived change directory, the synced openspec/specs/ paths, and the implementation files touched by the change in a single commit whose message follows the commit policy in AGENTS.md (https://cbea.ms/git-commit/). Stage those paths explicitly; do not use git add -A.
